name: Build and Make Zenith Player Windows

on:
    push:
        branches:
            - master
        tags:
            - 'v*.*.*'
    pull_request:
        branches:
            - master
    workflow_dispatch:

jobs:
    build-windows:
        name: Build Windows x64
        runs-on: windows-2022
        timeout-minutes: 120

        concurrency:
            group: ${{ github.workflow }}-windows-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: ${{ github.event_name == 'pull_request' }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Inject TMDB API key
              env:
                  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
              run: node tools/tmdb/inject-tmdb-key.mjs

            - name: Inject build commit
              env:
                  BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
              run: node tools/build/inject-build-commit.mjs

            - name: Build frontend
              run: pnpm nx build web --skip-nx-cache

            - name: Resolve Windows Embedded MPV cache key
              if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
              id: embedded-mpv-runtime-cache-key
              shell: bash
              env:
                  zenithplayer_WINDOWS_EMBEDDED_MPV_RUNTIME_SHA256: ${{ vars.zenithplayer_WINDOWS_EMBEDDED_MPV_RUNTIME_SHA256 || secrets.zenithplayer_WINDOWS_EMBEDDED_MPV_RUNTIME_SHA256 || '' }}
                  zenithplayer_DEFAULT_WINDOWS_EMBEDDED_MPV_RUNTIME_SHA256: 6014aa0e6d8e98cdba90f5288295a7105d7d14ab0ca906f51465eeb478d5fea0
              run: |
                  set -euo pipefail

                  WINDOWS_RUNTIME_SHA256="${zenithplayer_WINDOWS_EMBEDDED_MPV_RUNTIME_SHA256:-${zenithplayer_DEFAULT_WINDOWS_EMBEDDED_MPV_RUNTIME_SHA256}}"

                  SOURCE_SHA256="$(node -e "
                    const crypto = require('crypto');
                    const fs = require('fs');

                    const files = [
                      'tools/embedded-mpv/stage-runtime.mjs',
                      'tools/embedded-mpv/stage-windows-runtime-archive.mjs'
                    ];

                    const hash = crypto.createHash('sha256');

                    for (const file of files) {
                      hash.update(fs.readFileSync(file));
                    }

                    process.stdout.write(hash.digest('hex'));
                  ")"

                  RUNTIME_HASH="$(printf '%s' "${WINDOWS_RUNTIME_SHA256}" | sha256sum | cut -d ' ' -f 1)"

                  echo "key=embedded-mpv-runtime-v2-win32-x64-Windows-runtime${RUNTIME_HASH}-${SOURCE_SHA256}" >> "${GITHUB_OUTPUT}"

            - name: Restore Windows Embedded MPV runtime cache
              if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
              id: embedded-mpv-runtime-cache
              uses: actions/cache/restore@v4
              with:
                  path: |
                      vendor/embedded-mpv/win32-x64/include
                      vendor/embedded-mpv/win32-x64/lib
                      vendor/embedded-mpv/win32-x64/runtime-manifest.json
                  key: ${{ steps.embedded-mpv-runtime-cache-key.outputs.key }}

            - name: Stage Windows Embedded MPV runtime archive
              if: ${{ startsWith(github.ref, 'refs/tags/v') || steps.embedded-mpv-runtime-cache.outputs.cache-hit != 'true' }}
              shell: bash
              env:
                  zenithplayer_WINDOWS_EMBEDDED_MPV_RUNTIME_URL: ${{ vars.zenithplayer_WINDOWS_EMBEDDED_MPV_RUNTIME_URL || secrets.zenithplayer_WINDOWS_EMBEDDED_MPV_RUNTIME_URL || '' }}
                  zenithplayer_WINDOWS_EMBEDDED_MPV_RUNTIME_SHA256: ${{ vars.zenithplayer_WINDOWS_EMBEDDED_MPV_RUNTIME_SHA256 || secrets.zenithplayer_WINDOWS_EMBEDDED_MPV_RUNTIME_SHA256 || '' }}

                  zenithplayer_DEFAULT_WINDOWS_EMBEDDED_MPV_RUNTIME_URL: https://github.com/zhongfly/mpv-winbuild/releases/download/2026-07-17-94335ab87a/mpv-dev-lgpl-x86_64-20260717-git-94335ab87a.7z

                  zenithplayer_DEFAULT_WINDOWS_EMBEDDED_MPV_RUNTIME_SHA256: 6014aa0e6d8e98cdba90f5288295a7105d7d14ab0ca906f51465eeb478d5fea0

              run: |
                  set -euo pipefail

                  WINDOWS_RUNTIME_URL="${zenithplayer_WINDOWS_EMBEDDED_MPV_RUNTIME_URL}"
                  WINDOWS_RUNTIME_SHA256="${zenithplayer_WINDOWS_EMBEDDED_MPV_RUNTIME_SHA256}"

                  if [ -z "${WINDOWS_RUNTIME_URL}" ]; then
                      WINDOWS_RUNTIME_URL="${zenithplayer_DEFAULT_WINDOWS_EMBEDDED_MPV_RUNTIME_URL}"
                  fi

                  if [ -z "${WINDOWS_RUNTIME_SHA256}" ]; then
                      WINDOWS_RUNTIME_SHA256="${zenithplayer_DEFAULT_WINDOWS_EMBEDDED_MPV_RUNTIME_SHA256}"
                  fi

                  echo "Using Windows MPV runtime:"
                  echo "${WINDOWS_RUNTIME_URL}"

                  pnpm embedded-mpv:stage-runtime:windows-archive -- \
                      "${WINDOWS_RUNTIME_URL}" \
                      "${WINDOWS_RUNTIME_SHA256}"

            - name: Build backend
              env:
                  zenithplayer_EMBEDDED_MPV_PLATFORM: win32
                  zenithplayer_EMBEDDED_MPV_ARCH: x64
                  zenithplayer_REQUIRE_EMBEDDED_MPV: '1'
              run: pnpm run build:backend

            - name: Verify Windows Embedded MPV build
              shell: bash
              run: |
                  set -euo pipefail

                  test -f apps/electron-backend/native/build/Release/embedded_mpv.node
                  test -f dist/apps/electron-backend/native/embedded_mpv.node
                  test -f dist/apps/electron-backend/native/embedded-mpv-runtime.json
                  test -f dist/apps/electron-backend/native/zenithplayer_mpv_helper.exe
                  test -f dist/apps/electron-backend/native/embedded_mpv_frame_reader.node

                  find dist/apps/electron-backend/native -maxdepth 1 \
                      \( \
                          -name 'mpv-2.dll' \
                          -o -name 'libmpv-2.dll' \
                          -o -name 'mpv.dll' \
                          -o -name 'libmpv.dll' \
                      \) \
                      -print -quit | grep -q .

            - name: Override Windows architecture
              run: |
                  node -e "
                    const fs = require('fs');

                    const pkg = JSON.parse(
                      fs.readFileSync('electron-builder.json', 'utf8')
                    );

                    const targets = Array.isArray(pkg.win?.target)
                      ? pkg.win.target
                      : [];

                    for (const target of targets) {
                      if (target && typeof target === 'object') {
                        target.arch = ['x64'];
                      }
                    }

                    fs.writeFileSync(
                      'electron-builder.json',
                      JSON.stringify(pkg, null, 4) + '\n'
                    );
                  "

            - name: Make Zenith Player Windows
              env:
                  zenithplayer_EMBEDDED_MPV_PLATFORM: win32
                  zenithplayer_EMBEDDED_MPV_ARCH: x64
                  zenithplayer_REQUIRE_EMBEDDED_MPV: '1'
              run: pnpm run make:app -- --publishPolicy=never

            - name: Verify packaged worker layout
              shell: bash
              env:
                  PACKAGE_OS: windows
                  PACKAGE_ARCH: x64
                  zenithplayer_REQUIRE_EMBEDDED_MPV: '1'
              run: |
                  pnpm run verify:package-layout -- "$PACKAGE_OS" "$PACKAGE_ARCH"

            - name: Show generated Windows files
              shell: bash
              run: |
                  echo "Generated files:"
                  find dist/executables -type f | sort

            - name: Save Windows Embedded MPV runtime cache
              if: ${{ !startsWith(github.ref, 'refs/tags/v') && steps.embedded-mpv-runtime-cache.outputs.cache-hit != 'true' }}
              uses: actions/cache/save@v4
              with:
                  path: |
                      vendor/embedded-mpv/win32-x64/include
                      vendor/embedded-mpv/win32-x64/lib
                      vendor/embedded-mpv/win32-x64/runtime-manifest.json
                  key: ${{ steps.embedded-mpv-runtime-cache-key.outputs.key }}

            - name: Upload Windows artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: windows-artifacts
                  path: |
                      dist/executables/**/*.exe
                      dist/executables/**/*.msi
                      dist/executables/**/*.zip
                      dist/executables/**/latest.yml
                      dist/executables/**/*.blockmap
                  if-no-files-found: error
                  retention-days: 7


    create-release:
        name: Create Windows Draft Release
        needs:
            - build-windows

        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

        runs-on: ubuntu-latest

        permissions:
            contents: write

        concurrency:
            group: ${{ github.workflow }}-release-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: false

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Download Windows artifacts
              uses: actions/download-artifact@v4
              with:
                  name: windows-artifacts
                  path: artifacts/windows-artifacts

            - name: Display Windows artifacts
              run: |
                  find artifacts/windows-artifacts -type f -print

            - name: Get version
              id: package-version
              run: |
                  echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

            - name: Compose release metadata
              id: release-meta
              shell: bash
              env:
                  VERSION: ${{ steps.package-version.outputs.version }}
                  EVENT_NAME: ${{ github.event_name }}
                  IS_TAG_BUILD: ${{ startsWith(github.ref, 'refs/tags/') }}

                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  PR_TITLE: ${{ github.event.pull_request.title }}
                  PR_URL: ${{ github.event.pull_request.html_url }}

                  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
                  SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}

                  REPO_URL: ${{ github.server_url }}/${{ github.repository }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

              run: |
                  set -euo pipefail

                  SHORT_SHA="${HEAD_SHA:0:7}"
                  SAFE_BRANCH="${SOURCE_BRANCH//\//-}"

                  if [ "${IS_TAG_BUILD}" = "true" ]; then

                      NAME="Zenith Player v${VERSION}"
                      TAG="${GITHUB_REF_NAME}"
                      BODY=""

                  elif [ "${EVENT_NAME}" = "pull_request" ]; then

                      NAME="Zenith Player v${VERSION} — PR #${PR_NUMBER} [test]"
                      TAG="test-pr-${PR_NUMBER}"

                      BODY="$(printf \
                      'Test Windows build for PR #%s\n\nCommit: %s\nWorkflow: %s' \
                      "${PR_NUMBER}" \
                      "${SHORT_SHA}" \
                      "${RUN_URL}")"

                  else

                      NAME="Zenith Player v${VERSION} — Windows Test"
                      TAG="test-${SAFE_BRANCH}"

                      BODY="$(printf \
                      'Windows test build\n\nCommit: %s\nWorkflow: %s' \
                      "${SHORT_SHA}" \
                      "${RUN_URL}")"

                  fi

                  echo "name=${NAME}" >> "${GITHUB_OUTPUT}"
                  echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
                  echo "commitish=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"

                  {
                      echo "body<<EOF"
                      echo "${BODY}"
                      echo "EOF"
                  } >> "${GITHUB_OUTPUT}"

            - name: Check PR is still open
              if: github.event_name == 'pull_request'
              id: pr-state
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  echo "state=$(gh api \
                      "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}" \
                      --jq '.state')" >> "${GITHUB_OUTPUT}"

            - name: Remove old Draft Release assets
              if: github.event_name != 'pull_request' || steps.pr-state.outputs.state == 'open'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ steps.release-meta.outputs.tag }}
              shell: bash
              run: |
                  set -euo pipefail

                  release_id="$(
                      gh api \
                          "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                          --paginate |
                      jq -s \
                          --arg tag "${RELEASE_TAG}" \
                          'add | [.[] | select(.draft and .tag_name == $tag)][0].id // empty'
                  )"

                  if [ -z "${release_id}" ]; then
                      echo "No existing draft."
                      exit 0
                  fi

                  gh api \
                      "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
                      --paginate \
                      --jq '.[].id' |
                  xargs -r -n1 -I{} \
                      gh api \
                      -X DELETE \
                      "repos/${GITHUB_REPOSITORY}/releases/assets/{}"

            - name: Create Windows Draft Release
              id: draft-release
              if: github.event_name != 'pull_request' || steps.pr-state.outputs.state == 'open'

              uses: softprops/action-gh-release@v2

              with:
                  draft: true

                  prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}

                  name: ${{ steps.release-meta.outputs.name }}

                  tag_name: ${{ steps.release-meta.outputs.tag }}

                  target_commitish: ${{ steps.release-meta.outputs.commitish }}

                  body: ${{ steps.release-meta.outputs.body }}

                  generate_release_notes: true

                  files: |
                      artifacts/windows-artifacts/**/*.exe
                      artifacts/windows-artifacts/**/*.msi
                      artifacts/windows-artifacts/**/*.zip
                      artifacts/windows-artifacts/**/latest.yml
                      artifacts/windows-artifacts/**/*.blockmap

              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
