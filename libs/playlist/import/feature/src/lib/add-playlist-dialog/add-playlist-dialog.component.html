<div class="apd">
    <div mat-dialog-title class="apd-head">
        <h2 class="apd-title">Zenith Player Girişi</h2>
        <p class="apd-sub">
            Playlist bilgilerinizi ve Zenith Panel sunucu kodunuzu girin.
        </p>
    </div>

    <mat-dialog-content>
        <div class="apd-form-area">
            <app-xtream-code-import (addClicked)="closeDialog()" />
        </div>
    </mat-dialog-content>

    <mat-dialog-actions class="apd-actions">
        <div class="apd-actions__reset">
            <button
                mat-button
                type="button"
                [disabled]="xtreamImport()?.isTestingConnection"
                (click)="clearForm()"
            >
                {{ 'CLEAR' | translate }}
            </button>
        </div>

        <div class="apd-actions__decision">
            <button mat-button type="button" (click)="closeDialog()">
                {{ 'CANCEL' | translate }}
            </button>
            <button
                mat-stroked-button
                type="button"
                [disabled]="
                    !xtreamImport()?.form?.valid ||
                    xtreamImport()?.isTestingConnection
                "
                (click)="xtreamImport()?.testConnection()"
            >
                {{
                    xtreamImport()?.isTestingConnection
                        ? 'Kontrol ediliyor...'
                        : 'Bağlantıyı test et'
                }}
            </button>
            <button
                mat-flat-button
                color="primary"
                type="button"
                [disabled]="
                    !xtreamImport()?.form?.valid ||
                    xtreamImport()?.isTestingConnection
                "
                (click)="xtreamImport()?.addPlaylist()"
            >
                Giriş yap
            </button>
        </div>
    </mat-dialog-actions>
</div>
